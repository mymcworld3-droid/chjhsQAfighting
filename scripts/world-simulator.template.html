<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>青雲問道 · 大世界種子模擬器</title><style>/* SIMULATOR_CSS */</style></head>
<body><div id="sim-stage"><div id="sim-app">
<header><div class="brand"><span class="seal" aria-hidden="true">道</span><div><h1>大世界種子模擬器</h1><p>青雲問道 · 1000 × 1000 格</p></div></div><span class="local-badge">本機模擬</span></header>
<form id="seed-form" class="controls"><label>世界種子<input id="seed" maxlength="128" value="qingyun-2026" autocomplete="off" spellcheck="false"></label><button class="primary" type="submit" id="generate">生成世界</button><button type="button" id="random">隨機種子</button><button type="button" id="compare">比較四個種子</button><button type="button" id="export-json">匯出種子與變更</button><button type="button" id="import-json">匯入</button><input type="file" id="import-file" accept="application/json,.json" hidden></form>
<main><section class="map-pane"><div class="map-toolbar"><label>地圖圖層<select id="layer"><option value="terrain">海陸地貌</option><option value="danger">怪物等級帶</option><option value="resources">礦脈與資源</option><option value="sites">秘境與結構</option></select></label><label>點格操作<select id="paint"><option value="inspect">查看地格</option><option value="road">鋪設道路</option><option value="bridge">架設橋樑</option><option value="grass">改為草地</option><option value="water">改為水域</option><option value="rock">放置岩壁</option><option value="restore">還原此格</option></select></label><label class="check"><input id="show-changes" type="checkbox" checked>顯示變更</label></div>
<div class="map-stage"><canvas id="map" aria-label="世界總覽；拖曳平移、滾輪縮放，點擊查看地格" tabindex="0"></canvas><div id="map-hint">中央問道宗 · 道路圍成封閉圈會自動填滿 · 拖曳查看</div><div class="map-buttons"><button id="zoom-in" type="button" aria-label="放大">＋</button><button id="zoom-out" type="button" aria-label="縮小">−</button><button id="fit" type="button">全圖</button><button id="spawn" type="button">問道宗</button><button id="export-png" type="button">匯出圖</button></div><div id="loading" role="status"><span id="loading-label">正在生成世界</span><progress id="progress" max="100" value="0"></progress></div></div></section>
<aside><section class="inspection"><h2>地格資訊 <span id="tile-coordinate">點選地圖</span></h2><div id="tile-info">選擇地格查看地貌、妖獸等級、秘境、結構或礦脈。放大後可看清相鄰地格。</div></section><section><h2>生成基底統計 <span id="generation-time"></span></h2><div id="stats" class="stats"></div><div id="tier-stats"></div></section><section class="legend-section"><h2>圖例與標記</h2><div id="legend" class="legend"></div><div class="marker-toggles"><label><input type="checkbox" data-marker="realm" checked>秘境</label><label><input type="checkbox" data-marker="structure" checked>結構</label><label><input type="checkbox" data-marker="monster">妖獸</label><label><input type="checkbox" data-marker="vein">礦脈</label></div></section><p class="storage-note">地形由種子在本機重建；匯出僅含種子、生成版本與改動地格，不包含百萬格基底。此工具不會修改正式世界。</p></aside></main>
<footer><span id="status" role="status">準備生成</span><span id="storage">地圖變更 0 格</span></footer>
<dialog id="compare-dialog"><div class="dialog-heading"><div><h2>四種世界，同一套生成規則</h2><p>選擇一張地圖，載入該種子繼續查看。</p></div><button id="close-compare" type="button" aria-label="關閉比較">×</button></div><div id="compare-grid"></div></dialog>
</div></div><script id="world-core-source">/* WORLD_CORE */</script><script id="world-worker-source" type="text/plain">/* WORLD_WORKER */</script><script>/* SIMULATOR_JS */</script></body></html>
