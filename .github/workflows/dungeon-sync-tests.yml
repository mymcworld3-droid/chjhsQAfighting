name: Dungeon co-op synchronization acceptance

on:
  push:
    branches: [stamina-battle]
    paths:
      - 'dungeon-room-*.cjs'
      - 'dungeon-map-generator.cjs'
      - 'dungeon-movement.cjs'
      - 'dungeon-battle-clock.cjs'
      - 'dungeon-enemy-ai.cjs'
      - 'dungeon-enemy-combat.cjs'
      - 'dungeon-player-combat.cjs'
      - 'dungeon-manual-progression.cjs'
      - 'manual-reward-rules.cjs'
      - 'dungeon-objectives.cjs'
      - 'dungeon-boss-battle.cjs'
      - 'dungeon-team-rescue.cjs'
      - 'dungeon-victory-reward.cjs'
      - 'dungeon-skill-combat.cjs'
      - 'dungeon-quiz-api.cjs'
      - 'dungeon-quiz-credit.cjs'
      - 'server.js'
      - 'dungeon-room-api.cjs'
      - 'invitation-api.cjs'
      - 'public/cultivation/dungeon-*.js'
      - 'public/styles/dungeon-lobby.css'
      - 'public/styles/dungeon-map-view.css'
      - 'public/module-versions.json'
      - 'tests/dungeon-*.test.cjs'
      - '.github/workflows/dungeon-sync-tests.yml'
  workflow_dispatch:

jobs:
  dungeon-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify asset manifest
        run: npm run check:module-versions
      - name: Check server syntax
        run: |
          node --check dungeon-room-api.cjs
          node --check dungeon-map-generator.cjs
          node --check dungeon-movement.cjs
          node --check dungeon-battle-clock.cjs
          node --check dungeon-enemy-ai.cjs
          node --check dungeon-enemy-combat.cjs
          node --check dungeon-player-combat.cjs
          node --check dungeon-manual-progression.cjs
          node --check manual-reward-rules.cjs
          node --check dungeon-objectives.cjs
          node --check dungeon-boss-battle.cjs
          node --check dungeon-team-rescue.cjs
          node --check dungeon-victory-reward.cjs
          node --check dungeon-skill-combat.cjs
          node --check dungeon-quiz-api.cjs
          node --check dungeon-quiz-credit.cjs
          node --check server.js
          node --check dungeon-room-stream.cjs
          node --check invitation-api.cjs
      - name: Check map ES modules parse
        run: |
          for module in public/cultivation/dungeon-map-camera.js public/cultivation/dungeon-map-painter.js public/cultivation/dungeon-map-view.js public/cultivation/dungeon-quiz-panel.js; do
            node --input-type=module --check < "$module"
          done
      - name: Test multiplayer lobby, SSE, reconnect and permissions
        run: node --test tests/dungeon-*.test.cjs
