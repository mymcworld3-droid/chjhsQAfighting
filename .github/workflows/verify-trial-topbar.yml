name: Validate retained trial header (one-time)
# Restored 收起 is intentionally visible as the fifth button.
on:
  push:
    branches: [fix/stamina-trial-restore-topbar-20261111]
    paths: [.github/workflows/verify-trial-topbar.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify local module versions
        run: |
          npm run build:module-versions
          npm run check:module-versions
          node --check public/cultivation/tactical-combat.js
          node --check scripts/test-tactical-browser.cjs
      - name: Run complete unit/regression tests
        run: npm test
      - name: Check real browser header and sketch controls in three orientations
        env:
          TACTICAL_SKETCH_ONLY: '1'
        run: node scripts/test-tactical-browser.cjs /tmp/topbar-verified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-header-landscape-portrait-screens
          path: /tmp/topbar-verified
          if-no-files-found: ignore
      - name: Commit verified changes
        run: |
          git rm .github/workflows/verify-trial-topbar.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tactical): restore original trial header and 收起 button'
          git push origin HEAD:refs/heads/fix/stamina-trial-restore-topbar-20261111
