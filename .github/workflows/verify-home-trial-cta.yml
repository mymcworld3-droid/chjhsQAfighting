name: Verify home trial CTA viewport fix (one-time)
on:
  push:
    branches: [fix/stamina-home-trial-button-viewport-20261111]
    paths: [.github/workflows/verify-home-trial-cta.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Update and validate asset versions
        run: |
          npm run build:module-versions
          npm run check:module-versions
      - name: Verify syntax and code patch
        run: |
          node --check tests/home-wireframe.test.cjs
          node --check public/cultivation/home-wireframe.js
          git diff --check
      - name: Run full regression suite
        run: npm test
      - name: Commit validated change on staging
        run: |
          git rm .github/workflows/verify-home-trial-cta.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(home): keep trial button visible above bottom navigation on iPad'
          git push origin HEAD:refs/heads/fix/stamina-home-trial-button-viewport-20261111
