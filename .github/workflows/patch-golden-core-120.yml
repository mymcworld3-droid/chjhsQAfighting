name: One-time Golden Core 120 patch

on:
  push:
    paths:
      - '.github/workflows/patch-golden-core-120.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch legacy realm thresholds
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/main-legacy.js')
          text = path.read_text()
          replacements = {
              "{ name: '金丹', sub: '丹成一品', need: 150, emoji: '☀️' }": "{ name: '金丹', sub: '丹成一品', need: 120, emoji: '☀️' }",
              "{ name: '元嬰', sub: '元嬰出竅', need: 200, emoji: '✨' }": "{ name: '元嬰', sub: '元嬰出竅', need: 500, emoji: '✨' }",
              "{ name: '化神', sub: '神念通天', need: 300, emoji: '🔮' }": "{ name: '化神', sub: '神念通天', need: 800, emoji: '🔮' }",
              "{ name: '煉虛', sub: '虛空悟道', need: 450, emoji: '🌌' }": "{ name: '煉虛', sub: '虛空悟道', need: 1200, emoji: '🌌' }",
              "{ name: '合體', sub: '天地合一', need: 650, emoji: '☯️' }": "{ name: '合體', sub: '天地合一', need: 1800, emoji: '☯️' }",
              "{ name: '大乘', sub: '大道將成', need: 900, emoji: '⚡' }": "{ name: '大乘', sub: '大道將成', need: 2600, emoji: '⚡' }",
              "{ name: '渡劫', sub: '雷劫問道', need: 1200, emoji: '⛈️' }": "{ name: '渡劫', sub: '雷劫問道', need: 3600, emoji: '⛈️' }",
              "{ name: '真仙', sub: '踏入仙門', need: 1600, emoji: '🪽' }": "{ name: '真仙', sub: '踏入仙門', need: 5000, emoji: '🪽' }",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected legacy realm line: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          theme = Path('public/cultivation/cultivation-theme.js')
          t = theme.read_text().replace("emoji: '🪨️'", "emoji: '🪨'")
          theme.write_text(t)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/main-legacy.js public/cultivation/cultivation-theme.js
          git commit -m 'balance: synchronize legacy realm curve with Golden Core 120'
          git push
