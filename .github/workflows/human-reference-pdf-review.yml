name: Human reference PDF review preparation

on:
  workflow_dispatch:
    inputs:
      acquisition_batch:
        description: 'Optional new-source acquisition batch number; blank uses existing pending queue'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/human-reference-pdf-review.yml
      - scripts/prepare-human-reference-review.cjs
      - 'docs/reference-candidates/high-school-2-batch-*.json'
      - tests/prepare-human-reference-review.test.cjs

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate queue and extraction helpers
        run: |
          node --check scripts/prepare-human-reference-review.cjs
          node scripts/prepare-human-reference-review.cjs --self-test
          node scripts/prepare-human-reference-review.cjs --manifest-only --out "$RUNNER_TEMP/reference-review"
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Run PDF acquisition and extraction regression tests
        run: RUN_POPPLER_TEST=1 node --test tests/prepare-human-reference-review.test.cjs
      - name: Acquire and extract originals for review
        env:
          ACQUISITION_BATCH: ${{ inputs.acquisition_batch }}
          IS_BATCH_24_PUSH: ${{ github.event_name == 'push' && contains(github.event.head_commit.added, 'docs/reference-candidates/high-school-2-batch-24.json') }}
        run: |
          args=()
          if [ "$IS_BATCH_24_PUSH" = "true" ]; then ACQUISITION_BATCH=24; fi
          if [ -n "$ACQUISITION_BATCH" ]; then args+=(--acquisition-batch "$ACQUISITION_BATCH"); fi
          node scripts/prepare-human-reference-review.cjs --download --render "${args[@]}" --out "$RUNNER_TEMP/reference-review"
      - name: Upload source status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-review-report
          path: |
            ${{ runner.temp }}/reference-review/worklist.json
            ${{ runner.temp }}/reference-review/extraction-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload unapproved source evidence for private repository reviewers
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: reference-review-unapproved-evidence
          path: |
            ${{ runner.temp }}/reference-review/evidence/
            ${{ runner.temp }}/reference-review/raw-candidates.json
          if-no-files-found: warn
          retention-days: 3

  provenance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify formal reference-bank policy and source audit
        run: |
          node --test tests/quiz-references.test.cjs
          node scripts/audit-human-reference-provenance.cjs "$RUNNER_TEMP/reference-provenance-report.json"
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-reference-provenance-report
          path: ${{ runner.temp }}/reference-provenance-report.json
          if-no-files-found: warn
