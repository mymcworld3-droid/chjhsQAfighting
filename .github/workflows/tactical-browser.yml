name: Tactical browser acceptance

on:
  push:
    branches: [stamina-battle, main]
  pull_request:
    branches: [stamina-battle, main]

jobs:
  mobile-battle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Portrait and landscape battle acceptance
        run: TACTICAL_SKETCH_ONLY=1 node scripts/test-tactical-browser.cjs
      - name: Manual training artwork stability
        if: ${{ !cancelled() }}
        run: node scripts/test-manual-training-browser.cjs
      - name: Weapon dungeon entry, signed quiz, resume and victory
        if: ${{ !cancelled() }}
        run: node scripts/test-weapon-dungeons-browser.cjs
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactical-and-weapon-dungeon-screenshots
          path: |
            /tmp/tactical-browser/*.png
            /tmp/weapon-dungeon-browser/*.png
          if-no-files-found: ignore
      # Co-op dungeon map has an independent path-scoped browser workflow:
      # .github/workflows/dungeon-browser.yml. Keep battle UI failures separate.
