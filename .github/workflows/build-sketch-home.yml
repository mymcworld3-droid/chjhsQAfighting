name: Build sketch-based stamina homepage (one-time)
on:
  push:
    branches: [feature/stamina-sketch-home-20261111]
    paths: [.github/workflows/build-sketch-home.yml]
permissions:
  contents: write
jobs:
  implement-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Add responsive sketch home to original game
        run: node scripts/implement-stamina-sketch-home-once.cjs
      - name: Install dependencies and rebuild local versions
        run: |
          npm ci --no-audit --no-fund
          npm run build:module-versions
          npm run check:module-versions
      - name: Verify browser and server syntax
        run: |
          node --check public/main.js
          node --check public/cultivation/home-ecology-dashboard.js
          node --check public/cultivation/home-ecology-scenes.js
          node --check server.js
          git diff --check
      - name: Run entire regression suite
        run: npm test
      - name: Commit tested homepage to staging
        run: |
          git rm -f .github/workflows/build-sketch-home.yml scripts/implement-stamina-sketch-home-once.cjs
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(home): implement responsive ecological CG sketch layout'
          git push origin HEAD:refs/heads/feature/stamina-sketch-home-20261111
