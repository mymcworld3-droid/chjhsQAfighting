name: Weapon system fast acceptance
on:
  push:
    branches: [stamina-battle]
    paths:
      - 'public/cultivation/manual-rules.js'
      - 'public/cultivation/tactical-rules.js'
      - 'public/cultivation/weapon-*.js'
      - 'public/cultivation/tactical-combat.js'
      - 'public/cultivation/tactical-impact-presentation.js'
      - 'public/styles/weapon-dungeons.css'
      - 'tactical-combat-api.cjs'
      - 'weapon-dungeon-rewards.cjs'
      - 'dungeon-enemy-ai.cjs'
      - 'dungeon-skill-combat.cjs'
      - 'tests/weapon-dungeons*.test.cjs'
      - 'tests/dungeon-enemy-combat.test.cjs'
      - 'tests/weapon-loadout.test.cjs'
      - 'tests/tactical-loadout-switch.test.cjs'
      - 'tests/manual-*.test.cjs'
      - 'tests/tactical-*.test.cjs'
      - 'package.json'
      - '.github/workflows/weapon-regression.yml'
  workflow_dispatch:
jobs:
  weapon:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Weapon, tactical, cultivation and dungeon regression
        run: npm run test:battle
