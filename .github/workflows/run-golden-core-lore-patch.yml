name: Run Golden Core lore patch

on:
  push:
    paths:
      - '.github/golden-core-lore-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply lore patch
        run: python .github/scripts/patch-golden-core-lore.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cultivation/cultivation-training-v4.js \
                  public/cultivation/golden-core-tutorial.js \
                  public/cultivation/cultivation-core-equip-warning.js \
                  public/cultivation/cultivation-status-panel.js \
                  public/cultivation/cultivation-rules.js \
                  public/cultivation/golden-core-battle-effects.js
          git diff --cached --quiet || git commit -m "feat: define Golden Cores as innate spirit-field cores"
          git push
