name: Run Golden Core roster patch

on:
  push:
    paths:
      - '.github/golden-core-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-golden-core-roster.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git add public/cultivation/cultivation-training-v4.js public/main-legacy.js public/cultivation/cultivation-status-panel.js tests/progression-gates.test.cjs tests/cultivation.test.cjs
          git commit -m 'feat: update Golden Core roster and effects'
          git push
