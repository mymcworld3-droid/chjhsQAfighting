name: Validate updated stamina home wireframe (one-time)
on:
  push:
    branches: [feature/stamina-home-wireframe-progress-20261111]
    paths: [.github/workflows/verify-home-wireframe.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and update version manifest
        run: |
          npm ci --no-audit --no-fund
          npm run build:module-versions
          npm run check:module-versions
      - name: Verify implementation syntax
        run: |
          node --check public/main.js
          node --check public/cultivation/home-wireframe.js
          node --check public/cultivation/home-correction-progress.js
          node --check public/cultivation/quest-system.js
          git diff --check
      - name: Run all regression tests
        run: npm test
      - name: Commit verified implementation to staging
        run: |
          git rm .github/workflows/verify-home-wireframe.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(home): sketched page with live daily and correction progress'
          git push origin HEAD:refs/heads/feature/stamina-home-wireframe-progress-20261111
