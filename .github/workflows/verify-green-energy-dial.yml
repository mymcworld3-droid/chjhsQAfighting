name: Verify green charging arc and ready pulse (one-time)
on:
  push:
    branches: [feature/stamina-green-energy-dial-20261111]
    paths: [.github/workflows/verify-green-energy-dial.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Rebuild module versions and validate source
        run: |
          npm run build:module-versions
          npm run check:module-versions
          node --check public/cultivation/tactical-combat.js
          node --check tests/tactical-quarter-camera.test.cjs
          node --check scripts/test-tactical-browser.cjs
          git diff --check
      - name: Run full regression suite
        run: npm test
      - name: Verify green arc, pulsing states and sketch layout in browser
        env:
          TACTICAL_SKETCH_ONLY: '1'
        run: node scripts/test-tactical-browser.cjs /tmp/green-energy-dial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: green-energy-dial-portraits-and-landscapes
          path: /tmp/green-energy-dial
          if-no-files-found: ignore
      - name: Save tested changes to staging
        run: |
          git rm .github/workflows/verify-green-energy-dial.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(tactical): live green energy ring and ready-to-charge lightning'
          git push origin HEAD:refs/heads/feature/stamina-green-energy-dial-20261111
