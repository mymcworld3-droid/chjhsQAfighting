name: Run equipped Golden Core legacy repair

on:
  push:
    paths:
      - '.github/equipped-core-legacy-repair-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply legacy repair
        run: python .github/scripts/patch-equipped-core-legacy-repair.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cultivation/cultivation-training-v4.js
          git diff --cached --quiet || git commit -m "fix: repair pre-update washed core state"
          git push
