name: Reference question curriculum audit

on:
  push:
    branches: [main, stamina-battle]
    paths:
      - 'question-references/**'
      - 'concept-registry/**'
      - 'curriculum-data/**'
      - 'public/curriculum-data/**'
      - 'curriculum-catalog.cjs'
      - 'adaptive-learning-api.cjs'
      - 'public/cultivation/curriculum-range-rules.js'
      - 'quiz-references.cjs'
      - 'human-reference-policy.cjs'
      - 'scripts/audit-human-reference-provenance.cjs'
      - 'server.js'
      - 'AGENTS.md'
      - 'docs/human-reference-provenance.md'
      - 'tests/quiz-references.test.cjs'
      - 'scripts/build-curriculum-catalog.cjs'
      - 'scripts/audit-curriculum-coverage.cjs'
      - 'tests/curriculum-catalog.test.cjs'
      - 'public/high_school_unit_name/**'
      - 'public/elementary_school_unit_name/**'
      - 'public/middle_school_unit_name/**'
      - 'public/cultivation/curriculum-scope.js'
      - 'public/cultivation/knowledge-points.js'
      - 'scripts/audit-curriculum-inventory.cjs'
      - 'tests/curriculum-inventory.test.cjs'
      - 'docs/curriculum-inventory.*'
      - 'tests/quiz-reference-*.test.cjs'
      - 'tests/retired-it-scope.test.cjs'
      - '.github/workflows/reference-question-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'question-references/**'
      - 'concept-registry/**'
      - 'curriculum-data/**'
      - 'public/curriculum-data/**'
      - 'curriculum-catalog.cjs'
      - 'adaptive-learning-api.cjs'
      - 'public/cultivation/curriculum-range-rules.js'
      - 'quiz-references.cjs'
      - 'human-reference-policy.cjs'
      - 'scripts/audit-human-reference-provenance.cjs'
      - 'server.js'
      - 'AGENTS.md'
      - 'docs/human-reference-provenance.md'
      - 'tests/quiz-references.test.cjs'
      - 'scripts/build-curriculum-catalog.cjs'
      - 'scripts/audit-curriculum-coverage.cjs'
      - 'tests/curriculum-catalog.test.cjs'
      - 'public/high_school_unit_name/**'
      - 'public/elementary_school_unit_name/**'
      - 'public/middle_school_unit_name/**'
      - 'public/cultivation/curriculum-scope.js'
      - 'public/cultivation/knowledge-points.js'
      - 'scripts/audit-curriculum-inventory.cjs'
      - 'tests/curriculum-inventory.test.cjs'
      - 'docs/curriculum-inventory.*'
      - 'tests/quiz-reference-*.test.cjs'
      - 'tests/retired-it-scope.test.cjs'
  workflow_dispatch:

jobs:
  reference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check reference index, question options and curriculum coverage
        run: node --test tests/quiz-reference-curriculum.test.cjs tests/quiz-reference-core-coverage.test.cjs tests/retired-it-scope.test.cjs tests/curriculum-inventory.test.cjs
      - name: Check reproducible curriculum inventory (existing gaps remain reported)
        run: node scripts/audit-curriculum-inventory.cjs --check
      - name: Check registry, release gates and generated catalog freshness
        run: |
          node scripts/build-curriculum-catalog.cjs --check
          node scripts/audit-curriculum-coverage.cjs --check
          node --test tests/curriculum-catalog.test.cjs tests/quiz-references.test.cjs
      - name: Export per-question human-source audit
        run: node scripts/audit-human-reference-provenance.cjs reference-provenance-report.json
      - name: Upload source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-reference-provenance-report
          path: reference-provenance-report.json
          if-no-files-found: warn
