name: Run reverse core multiple patch

on:
  push:
    paths:
      - '.github/reverse-core-multiple-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch reverse core multiple triggers
        shell: python
        run: |
          from pathlib import Path

          training_path = Path('public/cultivation/cultivation-training-v4.js')
          training = training_path.read_text()

          old = """      effect(grade) { return `連續悟道達 ${Math.max(2, grade + 1)} 次的那一次，額外 +3 修為。`; },
      ability: '陰陽翻轉，在指定連勝節點爆發丹力。',
      upkeep: '保持連勝直到觸發節點。',
      warning: '只在達到指定連勝的那一次觸發。',
      note: '能逆轉陰陽、倒轉氣機。目前仍無法把星期一反轉成星期五，相關研究經費持續申請中。',
      resolve({ isCorrect, grade, previousStreak }) {
        const threshold = Math.max(2, grade + 1);
        return isCorrect && previousStreak + 1 === threshold
          ? { bonusGain: 3, message: `${this.name}陰陽反轉，額外 +3 修為` }
          : {};
      }"""

          new = """      effect(grade) {
        const threshold = Math.max(2, grade + 1);
        return `每逢連續悟道達 ${threshold} 次的倍數（如 ${threshold}、${threshold * 2}、${threshold * 3}…），額外 +3 修為。`;
      },
      ability: '陰陽翻轉，在指定連勝的倍數節點反覆爆發丹力。',
      upkeep: '保持連勝，倍數越往後仍可持續觸發。',
      warning: '一旦連勝中斷，倍數計數會從頭重新累積。',
      note: '例如門檻為 2 時會在 2、4、6、8… 觸發；門檻為 3 時則在 3、6、9… 觸發。至於把星期一反轉成星期五，研究經費仍在申請中。',
      resolve({ isCorrect, grade, previousStreak }) {
        const threshold = Math.max(2, grade + 1);
        const streak = previousStreak + 1;
        return isCorrect && streak % threshold === 0
          ? { bonusGain: 3, message: `${this.name}陰陽反轉，第 ${streak} 連勝觸發，額外 +3 修為` }
          : {};
      }"""

          if old not in training:
              raise SystemExit('expected reverse core block not found')
          training_path.write_text(training.replace(old, new, 1))

          test_path = Path('tests/progression-gates.test.cjs')
          tests = test_path.read_text()
          marker = "  assert.match(training, /bonusGain: 3/);"
          replacement = """  assert.match(training, /bonusGain: 3/);
  assert.match(training, /streak % threshold === 0/);
  assert.match(training, /2、4、6、8…/);
  assert.match(training, /3、6、9…/);"""
          if marker not in tests:
              raise SystemExit('test insertion point not found')
          test_path.write_text(tests.replace(marker, replacement, 1))
      - name: Run tests
        run: npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cultivation/cultivation-training-v4.js tests/progression-gates.test.cjs
          git diff --cached --quiet || git commit -m "feat: repeat reverse core bonus on streak multiples"
          git push
