name: One-time restore learning features to stamina (staging)
# Validate latest shared learning source with legacy tactical-specific regressions intact.
on:
  push:
    branches:
      - feature/restore-stamina-learning-20261111
    paths:
      - .github/workflows/restore-stamina-learning.yml
permissions:
  contents: write
jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Fetch exact main and stamina references
        run: git fetch origin main stamina-battle
      - name: Port requested features while preserving tactical battle
        run: node scripts/restore-stamina-learning.cjs
      - name: Install and build module version manifest
        run: |
          npm ci --no-audit --no-fund
          npm run build:module-versions
      - name: Validate JavaScript syntax and source changes
        run: |
          node --check server.js
          node --check public/main-legacy.js
          node --check public/cultivation/adaptive-learning.js
          node --check public/cultivation/daily-meditation.js
          git diff --check
      - name: Run complete unit and integration test suite
        run: npm test
      - name: Commit tested changes to staging only
        run: |
          git rm -f .github/workflows/restore-stamina-learning.yml scripts/restore-stamina-learning.cjs
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(stamina): restore main question banks, adaptive learning and daily meditation'
          git push origin HEAD:refs/heads/feature/restore-stamina-learning-20261111
