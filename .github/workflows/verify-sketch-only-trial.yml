name: Verify sketch-only trial layout (temporary)
on:
  push:
    branches: [fix/stamina-trial-exact-sketch-20261111]
    paths: [.github/workflows/verify-sketch-only-trial.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Rebuild versioned module manifest
        run: |
          npm run build:module-versions
          npm run check:module-versions
          node --check public/cultivation/tactical-combat.js
          node --check scripts/test-tactical-browser.cjs
      - name: Run all unit and gameplay tests
        run: npm test
      - name: Verify actual browser layout against hand sketch
        env:
          TACTICAL_SKETCH_ONLY: '1'
        run: node scripts/test-tactical-browser.cjs /tmp/sketch-only-trial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sketch-only-real-browser-screenshots
          path: /tmp/sketch-only-trial
          if-no-files-found: ignore
      - name: Save verified changes
        run: |
          git rm .github/workflows/verify-sketch-only-trial.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tactical): exact three-zone quarter-circle sketch layout'
          git push origin HEAD:refs/heads/fix/stamina-trial-exact-sketch-20261111
