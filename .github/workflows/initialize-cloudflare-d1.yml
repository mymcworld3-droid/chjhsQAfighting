name: Initialize Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: initialize-cloudflare-d1
  cancel-in-progress: false

jobs:
  initialize:
    name: Apply and verify D1 schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/d1
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Install Wrangler CLI
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Apply remote D1 schema migrations
        run: npx wrangler d1 migrations apply qingyun-game-prod --remote --yes
      - name: Verify required tables exist on remote D1
        run: |
          npx wrangler d1 execute qingyun-game-prod --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('documents','d1_admin_migration_jobs','d1_admin_migration_tasks') ORDER BY name;"
          echo "Review output: documents, d1_admin_migration_jobs and d1_admin_migration_tasks must all appear."
