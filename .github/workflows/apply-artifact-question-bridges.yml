name: Apply artifact question bridges

on:
  push:
    branches: [main]
    paths:
      - '.github/artifact-bridge-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bridges
        run: python .github/scripts/apply-artifact-question-bridges.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Commit bridges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cultivation/battle-mode-v2.js public/cultivation/dongtian.js
          git diff --cached --quiet || git commit -m "feat: bridge artifact option effects into battle and Dongtian"
          git push
