name: Cultivation regression tests

on:
  push:
    branches: [main, original, grid-world, stamina-battle]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify local module versions
        run: npm run check:module-versions
      - name: Run tests
        run: node --test --test-reporter=tap --test-timeout=60000 tests/*.test.cjs
