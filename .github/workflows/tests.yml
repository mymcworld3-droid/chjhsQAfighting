name: Cultivation regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Dongtian moderation patch
        if: github.event_name == 'push' && github.event.head_commit.message == 'chore: run Dongtian moderation patch'
        run: python .github/scripts/add-dongtian-moderation.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Commit Dongtian moderation feature
        if: github.event_name == 'push' && github.event.head_commit.message == 'chore: run Dongtian moderation patch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dongtian-api.js public/cultivation/dongtian.js tests/dongtian.test.cjs
          git diff --cached --quiet || git commit -m "feat: add AI-moderated Dongtian question repair"
          git push
