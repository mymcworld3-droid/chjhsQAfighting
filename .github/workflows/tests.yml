name: All branches - deploy safety and regression tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and rebuild manifest
        run: npm install --no-audit --no-fund
      - name: Confirm auto-generated asset manifest
        run: npm run check:module-versions
      - name: Verify server and deployment scripts
        run: |
          node --check server.js
          node --check deployment-guard.cjs
          node --check game-stage.cjs
          node --check public/deploy-guard.js
          node --check public/sw.js
      - name: Run deployment safeguards and gameplay tests
        run: npm test
