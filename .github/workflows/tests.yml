name: Cultivation regression tests

on:
  push:
    branches: [main, Improvement, Improve]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: chat-test-only
          POSTGRES_DB: friend_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d friend_chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_CHAT_DATABASE_URL: postgres://postgres:chat-test-only@127.0.0.1:5432/friend_chat_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify local module versions
        run: npm run check:module-versions
      - name: Run tests
        run: npm test
