name: Run equipped Golden Core state patch

on:
  push:
    paths:
      - '.github/equipped-core-state-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-equipped-core-state.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cultivation/cultivation-training-v4.js public/cultivation/cultivation-status-panel.js public/cultivation/golden-core-battle-effects.js
          git diff --cached --quiet || git commit -m "fix: preserve equipped Golden Core after washing"
          git push
