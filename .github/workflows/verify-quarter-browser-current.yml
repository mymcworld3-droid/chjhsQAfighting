name: Verify real-browser quarter HUD without retired weapon tests
on:
  push:
    branches: [test/stamina-quarter-real-browser-20261111]
    paths: [.github/workflows/verify-quarter-browser-current.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Node and browser
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save playwright@1.56.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check module versions and source
        run: |
          npm run check:module-versions
          node --check scripts/test-tactical-browser.cjs
      - name: Run complete automated suite
        run: npm test
      - name: Run browser gameplay in multiple screen orientations
        run: node scripts/test-tactical-browser.cjs /tmp/quarter-browser-current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quarter-trial-browser-screens
          path: /tmp/quarter-browser-current
          if-no-files-found: ignore
      - name: Commit validated browser test changes
        run: |
          git rm .github/workflows/verify-quarter-browser-current.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(tactical): validate existing directional combat without retired weapons'
          git push origin HEAD:refs/heads/test/stamina-quarter-real-browser-20261111
