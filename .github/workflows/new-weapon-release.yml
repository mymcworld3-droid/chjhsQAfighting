name: New weapon release candidate acceptance
on:
  push:
    branches: [main]
    paths:
      - 'public/cultivation/**'
      - 'public/assets/weapons/**'
      - 'public/assets/skills/**'
      - 'tests/**'
      - '*weapon*.cjs'
      - '*dungeon*.cjs'
      - '.github/workflows/new-weapon-release.yml'
  workflow_dispatch:
jobs:
  candidate-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Enable candidate in CI workspace only
        run: |
          node -e "const fs=require('node:fs');const p='public/cultivation/manual-rules.js';const s=fs.readFileSync(p,'utf8');if(!/const RELEASE_NEW_WEAPONS=(true|false);/.test(s))throw Error('Missing release gate');fs.writeFileSync(p,s.replace('const RELEASE_NEW_WEAPONS=false;','const RELEASE_NEW_WEAPONS=true;'));"
          npm run build:module-versions
          npm run check:module-versions
      - name: Complete regression with public catalog
        run: node --test --test-reporter=tap --test-timeout=60000 tests/*.test.cjs
