name: Verify radial controls and tactile map camera (one-time)
on:
  push:
    branches:
      - feature/stamina-quarter-dials-panzoom-20261111
    paths:
      - .github/workflows/verify-quarter-panzoom.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and rebuild module versions
        run: |
          npm ci --no-audit --no-fund
          npm run build:module-versions
          npm run check:module-versions
      - name: Verify browser-module and test syntax
        run: |
          node --check public/cultivation/tactical-camera.js
          node --check public/cultivation/tactical-renderer.js
          node --check public/cultivation/tactical-combat.js
          node --check tests/tactical-quarter-camera.test.cjs
          git diff --check
      - name: Run camera and control regression tests
        run: node --test tests/tactical-quarter-camera.test.cjs
      - name: Run full project regression suite
        run: npm test
      - name: Save validated frontend update in staging
        run: |
          git rm .github/workflows/verify-quarter-panzoom.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(tactical): radial controls and draggable pinch-zoom battlefield'
          git push origin HEAD:refs/heads/feature/stamina-quarter-dials-panzoom-20261111
