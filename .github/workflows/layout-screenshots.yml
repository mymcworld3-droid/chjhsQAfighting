name: Layout screenshots

on:
  push:
    branches: [Improve]
    paths:
      - 'public/**'
      - 'scripts/capture-layout.cjs'
      - 'scripts/capture-raid-rewards.cjs'
      - '.github/workflows/layout-screenshots.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture local UI states
        run: |
          node scripts/capture-layout.cjs
          node scripts/capture-raid-rewards.cjs
      - name: Save screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-screenshots
          path: layout-screenshots/
          if-no-files-found: warn
