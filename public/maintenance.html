<!doctype html>

<title>系統維護中｜青雲問道</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#363022 0%,#191711 44%,#090909 100%);color:#f1e2be;font-family:system-ui,"Noto Serif TC",serif;text-align:center}
main{max-width:520px;width:100%;padding:48px 24px;border:1px solid #9b7d485c;border-radius:22px;background:#16130fc9;box-shadow:0 24px 85px #0007}
.symbol{width:76px;height:76px;margin:0 auto 22px;border:1px solid #c2a56b;border-radius:50%;display:grid;place-items:center;font-size:34px;color:#d7b877}
h1{font-size:clamp(27px,6vw,37px);letter-spacing:.15em;margin:0 0 20px}p{font-size:15px;line-height:2;color:#c3b597;margin:0 0 26px}
button{cursor:pointer;color:#ffe7b6;background:linear-gradient(135deg,#8c692c,#534017);border:1px solid #d3ae62;border-radius:12px;padding:13px 28px;font-weight:700;font-size:15px}

</style>
</head>
<body><main role="main"><div class="symbol" aria-hidden="true">道</div><h1>系統維護中</h1><p>青雲問道正在進行資料庫維護與系統調整。<br>為保障修行資料安全，暫時停止遊戲服務。<br>完成後即可恢復使用，感謝耐心等候。</p><button type="button" onclick="location.reload()">重新檢查</button><small>青雲問道 · 以學入道</small></main></body></html>
