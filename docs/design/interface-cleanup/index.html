mall></figcaption><a href="status-landscape.jpg" target="_blank" rel="noopener"><img src="status-landscape.jpg" data-name="status" alt="狀態的橫式遊戲截圖"></a></figure></div></section></main><script>document.querySelectorAll('button[data-view]').forEach(button=>button.addEventListener('click',()=>{const view=button.dataset.view;document.body.dataset.view=view;document.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('img[data-name]').forEach(img=>{const file=img.dataset.name+'-'+view+'.jpg';img.src=file;img.parentElement.href=file;img.closest('figure').querySelector('small').textContent=view==='portrait'?'直式':'橫式';});}));</script></body></html>
